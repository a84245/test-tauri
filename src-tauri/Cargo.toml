[package]
name = "pengmaitw"
version = "0.3.0"
description = "芃麦印刷"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2.3"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Linux 下直接用 notify-rust 发通知并监听点击动作（tauri-plugin-notification
# 桌面端 show() 会丢弃 NotificationHandle，无法收到点击回调）。
notify-rust = "4"
# 全局键盘监听（扫码枪后台也能扫，无需窗口焦点）
rdev = "0.5"

# 仅 Windows 下用于设置进程级 AppUserModelID，使系统通知（Toast）的
# 点击激活能正确回传到本进程。否则 Windows 会把点击当作幽灵事件静默丢弃，
# 前端 onAction 不触发（窗口打不开、路由不跳转）。必须与开始菜单快捷方式
# 注册的 AUMID 一致。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }

