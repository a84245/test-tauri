<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>芃麦印刷</title>
  </head>
  <body>
    <h1>芃麦印刷</h1>
    <button id="notify-btn">发送系统通知</button>

    <script type="module">
      // 走壳原生 notify 命令（Linux 下点击通知可直接恢复窗口，
      // Windows/macOS 下由前端 onAction 恢复窗口并跳路由）
      const { invoke } = window.__TAURI__.core;
      const notifyBtn = document.getElementById("notify-btn");
      notifyBtn.addEventListener("click", async () => {
        await invoke("notify", {
          title: "芃麦印刷",
          body: "这是一条来自壳原生 API 的系统通知！点击我会打开窗口。",
        });
      });
    </script>
  </body>
</html>
