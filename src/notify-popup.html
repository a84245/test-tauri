<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通知</title>
    <style>
      /* ───────────────────────────────────────────────
         自绘通知卡片：淡蓝头部 + 白底黑字内容框 + 从右侧滑入
         窗口本身是「无边框 / 透明 / 置顶 / 不进任务栏」的独立窗口，
         主程序缩到托盘时也能弹。
         ─────────────────────────────────────────────── */
      :root {
        --brand: #0b49c8;
        --brand-soft: #2e6fe8;
        --ink: #1f2328;        /* 内容文字：近黑 */
        --ink-label: #8a94a6;  /* 字段名：灰 */
        --line: #e3e8f0;       /* 分隔线 / 内容框边框 */
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        background: transparent;   /* 窗口透明，只看得见卡片 */
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
      }

      body { padding: 6px 16px 16px 8px; }

      #stack {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;   /* 贴右下角；窗口向上长高 */
        gap: 12px;
      }

      /* ── 卡片 ── */
      .card {
        position: relative;
        border-radius: 16px;
        background: linear-gradient(150deg, #f7faff 0%, #eef4ff 45%, #e6efff 100%);
        border: 1px solid #dbe5f7;
        box-shadow: 0 14px 34px rgba(15, 45, 105, 0.16), 0 2px 8px rgba(15, 45, 105, 0.08);
        padding: 14px 16px 14px 16px;
        /* 从右侧滑入 */
        transform: translateX(118%);
        opacity: 0;
        transition: transform 0.46s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.34s ease;
      }
      .card.show { transform: translateX(0); opacity: 1; }
      .card.leaving {
        transform: translateX(118%); opacity: 0;
        transition: transform 0.32s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.3s ease;
      }

      /* ── 头部：标题 + 图标 ── */
      .head {
        display: flex; align-items: center; gap: 9px;
        padding-bottom: 12px;
      }
      .spark { flex-shrink: 0; color: var(--brand-soft); }
      .spark svg { width: 15px; height: 15px; display: block; }
      .spark.sm svg { width: 11px; height: 11px; }
      .spark {
        animation: twinkle 2.4s ease-in-out infinite;
      }
      .spark.sm { animation-delay: 0.5s; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.55; transform: scale(0.92) rotate(0deg); }
        50%      { opacity: 1;    transform: scale(1.06) rotate(12deg); }
      }

      .title {
        font-size: 16px; font-weight: 700; color: var(--brand);
        letter-spacing: 0.3px; line-height: 1.2;
      }

      .close {
        margin-left: auto;
        width: 26px; height: 26px; flex-shrink: 0;
        border: 0; border-radius: 8px;
        background: transparent; color: #9aa6bb;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.16s ease, color 0.16s ease;
      }
      .close:hover { background: #dde7fa; color: var(--brand); }
      .close svg { width: 14px; height: 14px; }

      /* ── 内容框：白底 · 黑字 · 细边框 · 多列表格 ── */
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 12px 14px 13px;
        box-shadow: 0 1px 2px rgba(15, 45, 105, 0.04);
      }

      /* 订单号：独占一行（WEB+17 位太长，塞进表格会挤坏其它列） */
      .orderno { display: flex; align-items: baseline; gap: 10px; padding-bottom: 11px; }
      .orderno .k { flex-shrink: 0; font-size: 12px; color: var(--ink-label); letter-spacing: 0.5px; }
      .orderno .v {
        font-family: ui-monospace, Consolas, "Courier New", monospace;
        font-size: 12.5px; color: var(--ink); font-weight: 500; letter-spacing: 0.2px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }

      /* 四列表格：客户 / 下单产品 / 下单时间 / 金额 */
      .tbl {
        display: grid;
        grid-template-columns: 1fr 1.55fr 1.15fr 0.85fr;
        column-gap: 10px;
      }
      .th {
        font-size: 11.5px; color: var(--ink-label); letter-spacing: 0.5px;
        padding-bottom: 6px; border-bottom: 1px solid var(--line);
      }
      .th.right { text-align: right; }
      .td {
        font-size: 12.5px; color: var(--ink); font-weight: 500;
        padding-top: 8px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .td.amount { font-size: 13.5px; font-weight: 700; text-align: right; }

      /* 没有结构化数据时的兜底：直接显示正文 */
      .fallback {
        font-size: 13px; color: var(--ink); line-height: 1.6;
        white-space: normal; word-break: break-word;
      }

      /* ── 操作按钮 ── */
      .actions { display: flex; gap: 10px; margin-top: 13px; }
      .btn {
        flex: 1;
        font: inherit; font-size: 13px; font-weight: 600;
        padding: 8px 0; border-radius: 9px;
        cursor: pointer; border: 1px solid transparent;
        transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease, transform 0.1s ease;
      }
      .btn:active { transform: scale(0.985); }
      .btn-primary { background: var(--brand); color: #fff; }
      .btn-primary:hover { background: #0a41b4; }
      .btn-ghost { background: #fff; color: #5b6577; border-color: var(--line); }
      .btn-ghost:hover { background: #f5f8ff; border-color: #c9d7f0; color: var(--brand); }
    </style>
  </head>
  <body>
    <div id="stack"></div>

    <script>
      const { listen } = window.__TAURI__.event;
      const { invoke } = window.__TAURI__.core;

      const stack = document.getElementById("stack");
      const cards = [];

      /** 四角星火花 */
      const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.6c.5 3.9 1.9 6.3 4.2 7.2 1.4.6 3.1.8 6.2.8-3.1 0-4.8.2-6.2.8-2.3.9-3.7 3.3-4.2 7.2-.5-3.9-1.9-6.3-4.2-7.2-1.4-.6-3.1-.8-6.2-.8 3.1 0 4.8-.2 6.2-.8C10.1 7.9 11.5 5.5 12 1.6Z"/></svg>';

      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);

      /** 窗口高度跟随内容变化（底边固定贴住屏幕右下角） */
      let resizeTimer = null;
      function syncHeight() {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          invoke("notify_popup_resize", { height: Math.ceil(document.body.scrollHeight) }).catch(() => {});
          if (cards.length === 0) invoke("notify_popup_hide").catch(() => {});
        }, 30);
      }

      function removeCard(entry, animate = true) {
        const i = cards.indexOf(entry);
        if (i < 0) return;
        cards.splice(i, 1);
        if (animate) {
          entry.el.classList.add("leaving");
          setTimeout(() => { entry.el.remove(); syncHeight(); }, 330);
        } else {
          entry.el.remove();
        }
      }

      /**
       * 渲染内容框：订单号独占一行，下面是四列表格（客户 / 下单产品 / 下单时间 / 金额）。
       * 缺字段就显示「—」以保持表格形状；一个字段都没有时返回空串，
       * 由调用方回退到纯文本正文。
       */
      function renderPanel(d) {
        if (!d) return "";
        const has = (v) => v !== undefined && v !== null && String(v).trim() !== "";
        const cols = [
          ["客户", d.customer, ""],
          ["下单产品", d.product, ""],
          ["下单时间", d.time, ""],
          ["金额", d.amount, "amount"],
        ];
        if (!has(d.orderNo) && !cols.some(([, v]) => has(v))) return "";

        const orderNoRow = has(d.orderNo)
          ? `<div class="orderno"><span class="k">订单号</span><span class="v">${esc(d.orderNo)}</span></div>`
          : "";
        const th = cols
          .map(([k, , cls]) => `<div class="th${cls === "amount" ? " right" : ""}">${k}</div>`)
          .join("");
        const td = cols
          .map(([, v, cls]) => `<div class="td ${cls}">${esc(has(v) ? v : "—")}</div>`)
          .join("");

        return `<div class="panel">${orderNoRow}<div class="tbl">${th}${td}</div></div>`;
      }

      function addCard(p) {
        const el = document.createElement("div");
        el.className = "card";

        const panelHtml = renderPanel(p.data);
        const bodyHtml = panelHtml
          ? panelHtml
          : (p.body ? `<div class="panel"><div class="fallback">${esc(p.body)}</div></div>` : "");

        el.innerHTML = `
          <div class="head">
            <span class="spark">${SPARK}</span>
            <span class="title">${esc(p.title || "新订单到了！")}</span>
            <span class="spark sm">${SPARK}</span>
            <button class="close" title="关闭">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
          ${bodyHtml}
          <div class="actions">
            ${p.path ? '<button class="btn btn-primary" data-act="view">查看订单</button>' : ""}
            <button class="btn btn-ghost" data-act="ignore">忽略</button>
          </div>
        `;

        const entry = { id: p.id, el };
        cards.push(entry);
        stack.appendChild(el);

        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));

        el.querySelector(".close").addEventListener("click", () => {
          invoke("notify_popup_action", { id: p.id ?? null, action: "ignore" }).catch(() => {});
          removeCard(entry);
        });
        el.querySelectorAll("[data-act]").forEach((b) => {
          b.addEventListener("click", () => {
            invoke("notify_popup_action", { id: p.id ?? null, action: b.getAttribute("data-act") }).catch(() => {});
            removeCard(entry);
          });
        });

        syncHeight();
      }

      const MAX_CARDS = 5;
      listen("notify:show", (e) => {
        const p = e.payload || {};
        while (cards.length >= MAX_CARDS) removeCard(cards[0], false);
        addCard(p);
      });
    </script>
  </body>
</html>
